name: CI-Maven

on:
  push:
    branches:
    - develop
    - rel/v*
  pull_request:
    branches: [ develop ]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11
          cache: maven
      - name: Run Checkstyle
        run: mvn -B checkstyle:check -pl driver

  build:
    runs-on: ubuntu-latest
    needs: [check]
    strategy:
      matrix:
        pg: [12, 13, 14, 15, 16, 17, 18]
        jdk: [11, 17, 21]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk }}
          cache: maven
      - name: Start PostgreSQL with SSL
        run: |
          docker create --name postgres -p 5432:5432 \
            -e POSTGRES_USER=test \
            -e POSTGRES_PASSWORD=test \
            -e POSTGRES_DB=test \
            postgres:${{ matrix.pg }} \
            --hba_file=/var/lib/postgresql/pg_hba.conf \
            --max-prepared-transactions=10 \
            --ssl=on \
            --ssl_ca_file=/var/lib/postgresql/root.crt \
            --ssl_cert_file=/var/lib/postgresql/server.crt \
            --ssl_key_file=/var/lib/postgresql/server.key
          docker cp ./driver/src/test/resources/certdir/server/pg_hba.conf postgres:/var/lib/postgresql/pg_hba.conf
          docker cp ./driver/src/test/resources/certdir/server/root.crt postgres:/var/lib/postgresql/root.crt
          docker cp ./driver/src/test/resources/certdir/server/server.crt postgres:/var/lib/postgresql/server.crt
          docker cp ./driver/src/test/resources/certdir/server/server.key postgres:/var/lib/postgresql/server.key
          docker exec postgres chown postgres:postgres /var/lib/postgresql/server.key /var/lib/postgresql/server.crt /var/lib/postgresql/root.crt /var/lib/postgresql/pg_hba.conf || true
          docker exec postgres chmod 600 /var/lib/postgresql/server.key || true
          docker start postgres
          timeout 60 bash -c 'until docker exec postgres pg_isready -U test; do sleep 1; done'
      - name: Setup test databases
        env:
          PGPASSWORD: test
        run: |
          psql -h localhost -U test -d test -c "CREATE EXTENSION IF NOT EXISTS hstore;"
          psql -h localhost -U test -d test -c "CREATE EXTENSION IF NOT EXISTS citext;"
          psql -h localhost -U test -d test -c "CREATE DATABASE testnoexts OWNER test;" || true
          psql -h localhost -U test -d test -c "CREATE DATABASE hostdb OWNER test;" || true
          psql -h localhost -U test -d hostdb -c "CREATE EXTENSION IF NOT EXISTS sslinfo;"
          psql -h localhost -U test -d test -c "CREATE DATABASE hostssldb OWNER test;" || true
          psql -h localhost -U test -d hostssldb -c "CREATE EXTENSION IF NOT EXISTS sslinfo;"
          psql -h localhost -U test -d test -c "CREATE DATABASE hostnossldb OWNER test;" || true
          psql -h localhost -U test -d hostnossldb -c "CREATE EXTENSION IF NOT EXISTS sslinfo;"
          psql -h localhost -U test -d test -c "CREATE DATABASE hostsslcertdb OWNER test;" || true
          psql -h localhost -U test -d hostsslcertdb -c "CREATE EXTENSION IF NOT EXISTS sslinfo;"
          psql -h localhost -U test -d test -c "CREATE DATABASE certdb OWNER test;" || true
          psql -h localhost -U test -d certdb -c "CREATE EXTENSION IF NOT EXISTS sslinfo;"
      - name: Build & Test
        run: |
          mvn -B verify -Dpgjdbc.test.server=localhost -Dpgjdbc.test.port=5432 \
            -Dpgjdbc.test.db=test -Dpgjdbc.test.user=test -Dpgjdbc.test.password=test \
            -Dcheckstyle.skip=true
      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-pg${{ matrix.pg }}-jdk${{ matrix.jdk }}
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/

  deploy:
    needs: [check, build]
    if: github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/heads/rel/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11
          cache: maven
          server-id: ossrh
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
      - name: Publish Maven Artifacts
        env:
          MAVEN_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
        run: mvn -B deploy -DskipTests
